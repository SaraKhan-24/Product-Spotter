name: product_spotter
description: Product recognition and identification app for identifying items and listing for resale
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^0.8.9
  google_mlkit_image_labeling: ^0.14.2
  google_mlkit_commons: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true